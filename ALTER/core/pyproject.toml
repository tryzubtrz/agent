[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alter-core"
version = "0.2.0"
description = "Policy-first orchestration core for ALTER"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["alter_core"]

[tool.vercel]
entrypoint = "alter_core.api:app"
