name: Migrate ALTER into agent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-alter.yml'

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Migrate and capture result
        id: migrate
        shell: bash
        run: |
          set +e
          LOG=/tmp/alter-migrate.log
          : > "$LOG"

          echo "Cloning source..." | tee -a "$LOG"
          git clone --depth 1 --branch alter-foundation https://github.com/tryzubtrz/ai.git /tmp/alter-source >>"$LOG" 2>&1
          RC=$?

          if [ "$RC" -eq 0 ]; then
            echo "Copying ALTER..." | tee -a "$LOG"
            rm -rf ALTER >>"$LOG" 2>&1
            cp -R /tmp/alter-source/ALTER ./ALTER >>"$LOG" 2>&1
            RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            find ALTER -type f -print0 | xargs -0 sed -i 's/tryzubtrz\/ai/tryzubtrz\/agent/g' >>"$LOG" 2>&1
            find ALTER -type f -print0 | xargs -0 sed -i 's/alter-foundation/main/g' >>"$LOG" 2>&1

            cat > README.md <<'EOF'
          # ALTER Agent

          Private home repository for **ALTER — Universal Digital Twin**.

          The product source lives in `ALTER/`:
          - `ALTER/web` — mobile-first PWA cockpit
          - `ALTER/core` — policy/orchestration API core
          - `ALTER/botpress` — Botpress ADK specialist and cloud deployment
          - `ALTER/ios` — SwiftUI companion foundation
          - `ALTER/docs` — architecture and threat model

          Botpress deployment is targeted at the configured ALTER workspace/bot and reads `BOTPRESS_PAT` only from GitHub Actions Secrets.
          EOF

            git config user.name "ALTER Cloud Migration" >>"$LOG" 2>&1
            git config user.email "actions@users.noreply.github.com" >>"$LOG" 2>&1
            git add ALTER README.md >>"$LOG" 2>&1
            if git diff --cached --quiet; then
              echo "No changes to commit." | tee -a "$LOG"
            else
              git commit -m "migrate: move ALTER foundation into agent repository" >>"$LOG" 2>&1
              RC=$?
              if [ "$RC" -eq 0 ]; then
                git push origin main >>"$LOG" 2>&1
                RC=$?
              fi
            fi
          fi

          if [ "$RC" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

          tail -n 30 "$LOG" > /tmp/alter-migrate-tail.log
          exit 0

      - name: Report migration result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ steps.migrate.outputs.result }}
        run: |
          BODY=$(python - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/alter-migrate-tail.log').read_text(errors='replace') if Path('/tmp/alter-migrate-tail.log').exists() else 'No diagnostic log available.'
          print(json.dumps('Migration diagnostic (no secrets):\n\n```\n' + text + '\n```'))
          PY
          )
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues" \
            -d "{\"title\":\"ALTER migration diagnostic: $RESULT\",\"body\":$BODY}"
