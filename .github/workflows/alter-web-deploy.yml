name: ALTER Web Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ALTER/web/**'

permissions:
  contents: read

concurrency:
  group: alter-web-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
    steps:
      - name: Check Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN is not set."
            echo "Fix: Settings → Secrets → Actions → New secret: VERCEL_TOKEN"
            echo "Get your token at: https://vercel.com/account/tokens"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ALTER/web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link ALTER Web project
        working-directory: ALTER/web
        run: vercel link --yes --token "$VERCEL_TOKEN"

      - name: Pull production environment
        working-directory: ALTER/web
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build production output
        working-directory: ALTER/web
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        working-directory: ALTER/web
        run: |
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "✅ ALTER Web deployed: $url"
