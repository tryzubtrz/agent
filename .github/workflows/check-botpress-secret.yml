name: Check Botpress Secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-botpress-secret.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret presence without exposing value
        env:
          BOTPRESS_PAT: ${{ secrets.BOTPRESS_PAT }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$BOTPRESS_PAT" ]; then
            STATUS="configured"
          else
            STATUS="missing"
          fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues" \
            -d "{\"title\":\"Botpress secret check: $STATUS\",\"body\":\"Automated presence check only. The secret value was never printed or stored.\"}"
