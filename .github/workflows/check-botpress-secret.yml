name: Check Botpress Secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-botpress-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          BOTPRESS_PAT: ${{ secrets.BOTPRESS_PAT }}
        run: |
          if [ -n "$BOTPRESS_PAT" ]; then
            echo "BOTPRESS_PAT_CONFIGURED=true"
          else
            echo "BOTPRESS_PAT_CONFIGURED=false"
            exit 2
          fi
