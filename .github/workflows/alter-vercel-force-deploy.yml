name: ALTER Vercel Force Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ALTER/core/.vercel-force-deploy'

permissions:
  contents: read

concurrency:
  group: alter-core-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_1Zqum253Ac7DPRLMBV4U56HERp0W
      VERCEL_ORG_ID: team_gJ5e2cC36eMxaFiQTVL7LKGd
    steps:
      - name: Check Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured in GitHub Actions; fallback deploy is unavailable."
            exit 4
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link ALTER Core project
        working-directory: ALTER/core
        run: vercel link --yes --project alter-app --scope vadym-tokaryk --token "$VERCEL_TOKEN"

      - name: Pull production environment
        working-directory: ALTER/core
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build production output
        working-directory: ALTER/core
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy production output
        working-directory: ALTER/core
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
