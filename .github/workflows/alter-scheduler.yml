name: ALTER Hourly Scheduler

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/alter-scheduler.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: alter-hourly-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get short-lived GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('alter-scheduler')
            core.setSecret(token)
            require('fs').writeFileSync('/tmp/alter-oidc', token, { mode: 0o600 })

      - name: Report safe OIDC claims
        run: |
          python - <<'PY'
          import base64, json
          token = open('/tmp/alter-oidc', encoding='utf-8').read().strip()
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload).decode('utf-8'))
          safe = {key: claims.get(key) for key in ('iss','aud','repository','ref','workflow_ref','event_name','sub')}
          print(json.dumps(safe, sort_keys=True))
          PY

      - name: Run due ALTER automations
        run: |
          TOKEN="$(cat /tmp/alter-oidc)"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/alter-scheduler-response --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --header 'Accept: application/json' \
            'https://alter-app-three.vercel.app/api/scheduler/tick')"
          cat /tmp/alter-scheduler-response
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ALTER scheduler returned HTTP $HTTP_CODE"
            exit 1
          fi
