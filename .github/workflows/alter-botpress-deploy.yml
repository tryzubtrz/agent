name: ALTER Botpress Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ALTER/botpress/deploy.request'

permissions:
  contents: read
  issues: write

concurrency:
  group: alter-botpress-production
  cancel-in-progress: true

env:
  BOTPRESS_WORKSPACE_ID: wkspace_01M0XTFXYMFEDGHEEKT710G22P
  BOTPRESS_BOT_ID: 64f3490a-183a-47c5-b825-97210771822f

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Botpress deploy credential
        id: auth
        env:
          BOTPRESS_PAT: ${{ secrets.BOTPRESS_PAT }}
        run: |
          if [ -z "$BOTPRESS_PAT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "BOTPRESS_PAT is not configured; deployment cannot continue."
            exit 3
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Detect optional GitHub runtime smoke credential
        id: runtime
        env:
          BOTPRESS_RUNTIME_TOKEN: ${{ secrets.BOTPRESS_RUNTIME_TOKEN }}
        run: |
          if [ -n "$BOTPRESS_RUNTIME_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GitHub runtime credential is intentionally optional; production contract verification is delegated to ALTER Core Vault + OIDC smoke."
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      - name: Install dependencies
        working-directory: ALTER/botpress
        run: npm install --no-audit --no-fund

      - name: Authenticate Botpress ADK
        working-directory: ALTER/botpress
        env:
          BOTPRESS_PAT: ${{ secrets.BOTPRESS_PAT }}
        run: npx adk login --token "$BOTPRESS_PAT"

      - name: Link existing Botpress bot
        working-directory: ALTER/botpress
        run: npx adk link --workspace "$BOTPRESS_WORKSPACE_ID" --bot "$BOTPRESS_BOT_ID" --force

      - name: Type-check before deploy
        working-directory: ALTER/botpress
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx tsc --noEmit

      - name: Validate ADK structure before deploy
        working-directory: ALTER/botpress
        run: npx adk check

      - name: Deploy ALTER to Botpress Cloud
        working-directory: ALTER/botpress
        run: npx adk deploy --yes --allow-unconfigured

      - name: Verify deployed alterThink contract with optional GitHub credential
        id: contract
        if: steps.runtime.outputs.configured == 'true'
        env:
          BOTPRESS_RUNTIME_TOKEN: ${{ secrets.BOTPRESS_RUNTIME_TOKEN }}
        run: |
          set -euo pipefail
          cat >/tmp/alter-think-request.json <<'JSON'
          {
            "type": "alterThink",
            "input": {
              "objective": "Return a brief confirmation that ALTER specialist reasoning is online. Do not claim any side effect.",
              "context": "Post-deployment contract verification from GitHub Actions.",
              "mode": "quick"
            }
          }
          JSON
          HTTP_STATUS=$(curl -sS -o /tmp/botpress-runtime.json -w '%{http_code}' \
            --request POST \
            -H "Authorization: Bearer $BOTPRESS_RUNTIME_TOKEN" \
            -H "x-bot-id: $BOTPRESS_BOT_ID" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/alter-think-request.json \
            "https://api.botpress.cloud/v1/chat/actions")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Botpress alterThink contract verification failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/botpress-runtime.json').read_text())
          output = payload.get('output')
          if not isinstance(output, dict):
              raise SystemExit('Botpress response did not contain an output object.')
          response = output.get('response')
          if not isinstance(response, str) or not response.strip():
              raise SystemExit('Botpress alterThink returned no usable response.')
          if output.get('sideEffectsPerformed') is not False:
              raise SystemExit('Botpress alterThink violated the no-side-effect contract.')
          if output.get('boundary') != 'core-policy-required':
              raise SystemExit('Botpress alterThink returned an invalid Core policy boundary.')
          print('Botpress alterThink contract verified: usable response, no side effects, Core policy boundary intact.')
          PY

      - name: Report deploy result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          RUNTIME_CONFIGURED: ${{ steps.runtime.outputs.configured }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: |
          BODY=$(python - <<'PY'
          import json, os
          contract_outcome = os.environ.get('CONTRACT_OUTCOME') or 'not-run'
          runtime_configured = os.environ.get('RUNTIME_CONFIGURED') == 'true'
          if contract_outcome == 'success':
              contract_report = 'The deployed alterThink action contract was verified directly from GitHub Actions.'
          elif not runtime_configured:
              contract_report = 'GitHub runtime credential is not duplicated; contract verification is delegated to the ALTER Core Vault + GitHub OIDC production smoke.'
          else:
              contract_report = f'The direct alterThink contract verification did not pass (step outcome: {contract_outcome}).'
          body = (
              'Cloud deployment report. No secret values are included.\n\n'
              f"Job status: {os.environ.get('JOB_STATUS')}\n"
              f"Deploy credential check: {os.environ.get('AUTH_OUTCOME')}\n"
              'Target workspace: wkspace_01M0XTFXYMFEDGHEEKT710G22P\n'
              'Target bot: 64f3490a-183a-47c5-b825-97210771822f\n'
              f'{contract_report}\n'
              'Unconfigured optional dependencies are allowed to remain inert.'
          )
          print(json.dumps(body))
          PY
          )
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues" \
            -d "{\"title\":\"ALTER Botpress deploy: $JOB_STATUS\",\"body\":$BODY}"
