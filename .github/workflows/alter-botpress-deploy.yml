name: ALTER Botpress Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ALTER/botpress/deploy.request'

permissions:
  contents: read
  issues: write

concurrency:
  group: alter-botpress-production
  cancel-in-progress: false

env:
  BOTPRESS_WORKSPACE_ID: wkspace_01M0XTFXYMFEDGHEEKT710G22P
  BOTPRESS_BOT_ID: 64f3490a-183a-47c5-b825-97210771822f

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Botpress secret
        id: auth
        env:
          BOTPRESS_PAT: ${{ secrets.BOTPRESS_PAT }}
        run: |
          if [ -z "$BOTPRESS_PAT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "BOTPRESS_PAT is not configured yet; deployment is safely skipped."
            exit 3
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      - name: Install dependencies
        working-directory: ALTER/botpress
        run: npm install --no-audit --no-fund

      - name: Authenticate Botpress ADK
        working-directory: ALTER/botpress
        env:
          BOTPRESS_PAT: ${{ secrets.BOTPRESS_PAT }}
        run: npx adk login --token "$BOTPRESS_PAT"

      - name: Link existing Botpress bot
        working-directory: ALTER/botpress
        run: npx adk link --workspace "$BOTPRESS_WORKSPACE_ID" --bot "$BOTPRESS_BOT_ID" --force

      - name: Validate before deploy
        working-directory: ALTER/botpress
        run: npx adk check

      - name: Deploy ALTER to Botpress Cloud
        working-directory: ALTER/botpress
        run: npx adk deploy --yes

      - name: Report deploy result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
        run: |
          BODY=$(python - <<'PY'
          import json, os
          body = (
              'Cloud deployment report. No secret values are included.\n\n'
              f"Job status: {os.environ.get('JOB_STATUS')}\n"
              f"Secret check step: {os.environ.get('AUTH_OUTCOME')}\n"
              'Target workspace: wkspace_01M0XTFXYMFEDGHEEKT710G22P\n'
              'Target bot: 64f3490a-183a-47c5-b825-97210771822f'
          )
          print(json.dumps(body))
          PY
          )
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues" \
            -d "{\"title\":\"ALTER Botpress deploy: $JOB_STATUS\",\"body\":$BODY}"
